<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Css pessoal -->
    <link rel="stylesheet" href="../public/css/style.css">
    <link rel="stylesheet" href="../public/css/variaveis.css">
    
    <title>Document</title>
</head>

<body>
    <main>
        <section id="cadastro">
            <h2>CADASTRO</h2>
            <form id="formID">
                <article id="txtSucesso">Cadastro Realizado com Sucesso! </article>

                <fieldset>
                    <legend>Informações Pessoais</legend>

                    <label>Usuario:</label>
                    <input type="text" id="Usuario" name="txtUsuario" required>

                    <label>Senha:</label>
                    <input type="password" id="Senha" name="txtSenha" required>
                    <small id="alertSenha" class="d-none text-danger">a senha deve ter no mimino 6 caracteres</small>

                    <label>Telefone:</label>
                    <input type="tel" id="Telefone" name="txtTelefone" required>

                    <label>CPF:</label>
                    <input type="text" id="CPF" name="txtCPF" required>

                </fieldset>
                <br>
                <button type="button" id="btnCadastro">Enviar</button>
            </form>
        </section>
    </main>

</body>

</html>
